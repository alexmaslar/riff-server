[package]
name = "riff-core"
version = "0.1.0"
edition = "2021"
include = ["src/**/*", "migrations/**/*"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "migrate"] }
serde_yaml_ng = "0.10"
symphonia = { version = "0.5", features = ["flac", "isomp4", "aiff", "wav", "pcm", "alac", "mp3", "aac", "ogg", "vorbis"] }
walkdir = "2"
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
dirs = "6"
hex = "0.4"
reqwest = { workspace = true }
governor = "0.8"
bliss-audio = { version = "0.11", default-features = false, features = ["aubio-static", "update-aubio-bindings", "symphonia-all"] }
ebur128 = "0.1"
stratum-dsp = "1.0"
async-trait = "0.1"
image = { version = "0.25", features = ["png", "jpeg"] }
urlencoding = "2"
base64 = "0.22"
lofty = "0.22"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
